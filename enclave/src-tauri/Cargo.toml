[package]
name = "enclave"
version = "0.1.0"
description = "Enclave — On-premises corporate RAG + LoRA desktop application"
authors = ["Vlad (Softwarean)"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # key order is the order the planner writes its plan (ADR-0022)

# async runtime
tokio = { version = "1", features = ["full"] }

# database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }

# HTTP client for llama-server
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-manual-roots-no-provider"] }

# error handling
anyhow = "1"
thiserror = "2"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
time = "=0.3.36"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
pdf-extract = "0.12"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
calamine = { version = "0.36", features = ["dates"] }
# embedded PostgreSQL (ADR-0014): generated passwords, sealed with DPAPI
getrandom = "0.3"
# backups (ADR-0026): the save/open dialogs; the database URL split so the
# password reaches pg_dump through its environment, not its command line
tauri-plugin-dialog = "~2.7"   # the npm package must match major.minor
url = "2"
percent-encoding = "2"
tauri-plugin-single-instance = "2"
# office mode (ADR-0031): the server's HTTPS API — rustls on ring, as the
# rest of the tree (no aws-lc, which needs cmake and nasm on Windows); a
# self-signed certificate the clients pin; reqwest on rustls for the pin
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# OCR of scans (ADR-0028): Windows' own PDF renderer and text recognizer,
# through WinRT. The same version Tauri already brings in.
windows = { version = "0.61", features = [
    "Foundation", "Foundation_Collections", "Data_Pdf", "Globalization",
    "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT",
] }

[dev-dependencies]
rust_xlsxwriter = "0.99.1"
